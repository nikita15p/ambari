<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./stylesheets/vendor.css">
    <link rel="stylesheet" href="./stylesheets/app.css">
    <title>Ambari</title>
    <link rel="shortcut icon" href="/img/logo.png" type="image/x-icon">
</head>
<body>
    <div id="loading">...Loading...</div>
    <div id="wrapper">
        <!-- ApplicationView -->
    </div>
    <footer>
        <div class="container footer-links">
            <a data-qa="license-link" href="http://www.apache.org/licenses/LICENSE-2.0" target="_blank" rel="noopener noreferrer">Licensed under the Apache License, Version 2.0</a>.<br>
            <a data-qa="third-party-link" href="/licenses/NOTICE.txt" target="_blank" rel="noopener noreferrer">See third-party tools/resources that Ambari uses and their respective authors</a>
        </div>
    </footer>

    <!-- Scripts moved to end of body for better page load performance -->
    <script src="./javascripts/vendor.js"></script>
    <script src="./javascripts/app.js"></script>
    <script>
        // Wait for DOM and scripts to be fully loaded
        window.onload = function() {
            // Ensure jQuery is loaded
            if (typeof jQuery === 'undefined') {
                console.error('jQuery not loaded');
                document.getElementById('loading').textContent = 'Error: jQuery not loaded';
                return;
            }

            // Ensure Ember is loaded
            if (typeof Ember === 'undefined') {
                console.error('Ember not loaded');
                document.getElementById('loading').textContent = 'Error: Ember not loaded';
                return;
            }

            // Initialize within Ember run loop
            Ember.run(function() {
                try {
                    // Initialize jQuery browser detection
                    if (jQuery.browser === undefined) {
                        jQuery.browser = {};
                        jQuery.browser.msie = false;
                        jQuery.browser.version = 0;
                        if (navigator.userAgent.match(/MSIE ([0-9]+)\./)) {
                            jQuery.browser.msie = true;
                            jQuery.browser.version = RegExp.$1;
                        }
                    }

                    // Initialize the application
                    require('initialize');
                    
                    // make favicon work in firefox
                    jQuery('link[type*=icon]').detach().appendTo('head');
                    
                    // Remove loading indicator only after successful initialization
                    var loadingElement = document.getElementById('loading');
                    if (loadingElement) {
                        loadingElement.remove();
                    }
                } catch(e) {
                    console.error('Failed to initialize application:', e);
                    var loadingElement = document.getElementById('loading');
                    if (loadingElement) {
                        loadingElement.textContent = 'Error initializing application. Check console for details.';
                    }
                }
            });
        };
    </script>
</body>
</html>
