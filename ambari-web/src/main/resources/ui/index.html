<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambari Web</title>
</head>
<body>
    <div id="root"></div>
    <script type="text/javascript">
        // If it's exactly /#/login, redirect to classic login
        if (window.location.hash === '#/login') {
            window.location.href = '/classic/#/login';
        } 
        // For root path or any other path without specific routing
        else if (window.location.pathname === '/') {
            // Don't redirect if there's a hash (for classic routes)
            if (!window.location.hash) {
                window.location.href = '/latest';
            } else {
                window.location.href = '/classic' + window.location.pathname + window.location.hash;
            }
        }
    </script>
</body>
</html>
